<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>Record Summary</title>

    <link rel="stylesheet"
          href="file:///{{ css_path|replace('\\','/') }}">
</head>

<body>

<div class="header">

    <div class="logo-section">
        <img src="file:///{{ logo_path|replace('\\','/') }}" class="logo">
    </div>

    <div class="title-section">
        <h1>Record Management System</h1>
        <p>Professional Record Summary Report</p>
    </div>

</div>

{% block content %}
{% endblock %}

<div class="footer">

    <span>Generated by Record Management System</span>

    <span>Version {{ data.version }}</span>

    <span>Confidential</span>

</div>

</body>

</html>
