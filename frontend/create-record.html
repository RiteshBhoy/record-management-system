<!doctype html><html><head><title>Create Record</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"><script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script></head><body>
<div id="loader" class="spinner-overlay"><div class="spinner-border"></div></div>
<nav class="navbar navbar-dark bg-dark px-3"><a class="navbar-brand" href="/client.html">Record System</a>
<div><a class="btn btn-outline-light btn-sm me-2" href="/profile.html">Profile</a><button onclick="logout()" class="btn btn-danger btn-sm">Logout</button></div></nav>
<main class="container py-4"><h2 class="mb-4">Create Record</h2>
<form id="recordForm" class="row g-3">
<div class="col-md-4"><label class="required">Record ID</label><input name="record_id" class="form-control" required maxlength="80"></div>
<div class="col-md-4"><label class="required">Name</label><input name="name" class="form-control" required maxlength="120"></div>
<div class="col-md-2"><label class="required">Age</label><input name="age" type="number" min="1" max="120" class="form-control" required></div>
<div class="col-md-2"><label class="required">Sex</label><select name="sex" class="form-select"><option>Male</option><option>Female</option><option>Other</option></select></div>
<div class="col-md-4"><label class="required">Fees</label><input name="fees" type="number" min=".01" step=".01" class="form-control" required></div>
<div class="col-md-4"><label class="required">Email</label><input name="email" type="email" class="form-control" required></div>
<div class="col-md-4"><label class="required">Phone</label><input name="phone" class="form-control" required maxlength="10"></div>
<div class="col-12"><label class="required">Address</label><input name="address" class="form-control" required maxlength="500"></div>
<div class="col-md-4"><label class="required">City</label><input name="city" class="form-control" required></div>
<div class="col-md-4"><label class="required">State</label><input name="state" class="form-control" required></div>
<div class="col-md-4"><label class="required">Country</label><input name="country" class="form-control" value="India" required></div>
<div class="col-md-4"><label class="required">Occupation</label><input name="occupation" class="form-control" required></div>
<div class="col-md-4"><label>Blood Group</label><input name="blood_group" class="form-control"></div>
<div class="col-md-4"><label class="required">Nationality</label><input name="nationality" class="form-control" value="Indian" required></div>
<div class="col-md-4"><label>Marital Status</label><input name="marital_status" class="form-control"></div>
<div class="col-md-4"><label class="required">Aadhaar</label><input name="aadhaar" class="form-control" maxlength="12" required></div>
<div class="col-md-4"><label class="required">PAN</label><input name="pan" class="form-control" maxlength="10" required></div>
<div class="col-12"><label>Remarks</label><textarea name="remarks" class="form-control" maxlength="1000"></textarea></div>
<div class="col-12"><button class="btn btn-primary">Save Record</button></div></form>
</main><script src="/js/api.js"></script><script>guard('CLIENT');function payload(){const o=Object.fromEntries(new FormData(recordForm).entries());o.age=Number(o.age);o.fees=Number(o.fees);return o}
recordForm.addEventListener('submit',async e=>{e.preventDefault();try{await API.post('/records',payload());await Swal.fire('Saved','Record created and automatically locked','success');location.href='/client.html'}catch(_){}})
</script></body></html>
