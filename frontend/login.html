<!doctype html>
<html>

<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div id="loader" class="spinner-overlay">
        <div class="spinner-border"></div>
    </div>
    <div class="card auth-card shadow">
        <div class="card-body p-4">
            <h2 class="mb-4">Record Management Login</h2>
            <form id="form">
                <div class="mb-3"><label>Email</label><input id="email" type="email" class="form-control" required>
                </div>
                <div class="mb-3"><label>Password</label><input id="password" type="password" class="form-control"
                        required></div>
                <button class="btn btn-primary w-100">Login</button>
            </form>
            <p class="small text-muted mt-3">Seed password: Admin@123</p>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script>
        if (localStorage.getItem('access_token')) API.get('/auth/validate-token').then(r => location.href = r.data.data.role === 'ADMIN' ? '/admin.html' : '/client.html').catch(() => { });
        document.getElementById('form').addEventListener('submit', async e => { e.preventDefault(); try { const r = await API.post('/auth/login', { email: email.value, password: password.value }); localStorage.setItem('access_token', r.data.data.access_token); localStorage.setItem('role', r.data.data.role); location.href = r.data.data.role === 'ADMIN' ? '/admin.html' : '/client.html' } catch (_) { } });
    </script>
</body>

</html>
