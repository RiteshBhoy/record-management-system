<!doctype html><html><head><title>Login History</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"><script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script></head><body>
<div id="loader" class="spinner-overlay"><div class="spinner-border"></div></div>
<nav class="navbar navbar-dark bg-dark px-3"><a class="navbar-brand" href="/admin.html">Record System</a>
<div><a class="btn btn-outline-light btn-sm me-2" href="/profile.html">Profile</a><button onclick="logout()" class="btn btn-danger btn-sm">Logout</button></div></nav>
<main class="container py-4"><h2 class="mb-4">Login History</h2>
<div class="table-responsive"><table class="table table-sm"><thead><tr><th>Time</th><th>Email</th><th>IP</th><th>Browser</th><th>OS</th><th>Device</th><th>Active</th></tr></thead><tbody id="rows"></tbody></table></div>
</main><script src="/js/api.js"></script><script>guard('ADMIN');API.get('/admin/login-history').then(r=>rows.innerHTML=r.data.data.map(x=>`<tr><td>${x.created_at}</td><td>${x.email}</td><td>${x.login_ip}</td><td>${x.browser}</td><td>${x.operating_system}</td><td>${x.device_type}</td><td>${x.is_active}</td></tr>`).join(''));</script></body></html>
