<!doctype html><html><head><title>Client Dashboard</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"><script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script></head><body>
<div id="loader" class="spinner-overlay"><div class="spinner-border"></div></div>
<nav class="navbar navbar-dark bg-dark px-3"><a class="navbar-brand" href="/client.html">Record System</a>
<div><a class="btn btn-outline-light btn-sm me-2" href="/profile.html">Profile</a><button onclick="logout()" class="btn btn-danger btn-sm">Logout</button></div></nav>
<main class="container py-4"><h2 class="mb-4">Client Dashboard</h2>
<div class="d-flex gap-2 mb-3"><a class="btn btn-primary" href="/create-record.html">Create Record</a>
<input id="search" class="form-control" style="max-width:300px" placeholder="Search record ID or name"><button class="btn btn-secondary" onclick="load()">Search</button></div>
<div class="table-responsive"><table class="table table-hover"><thead><tr><th>Record ID</th><th>Name</th><th>Status</th><th>Locked</th><th>Version</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</main><script src="/js/api.js"></script><script>guard('CLIENT');
async function load(){const r=await API.get('/records',{params:{search:search.value,per_page:100}});rows.innerHTML=r.data.data.items.map(x=>`<tr><td>${x.record_id}</td><td>${x.name}</td><td>${x.status}</td><td>${x.is_locked?'Yes':'No'}</td><td>${x.version}</td><td><a class="btn btn-sm btn-info" href="/view-record.html?id=${x.id}">View</a></td></tr>`).join('')} load();
</script></body></html>
