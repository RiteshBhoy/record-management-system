<!doctype html>
<html>

<head>
    <title>Profile</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div id="loader" class="spinner-overlay">
        <div class="spinner-border"></div>
    </div>
    <div class="container py-5"><button onclick="history.back()" class="btn btn-secondary mb-3">Back</button>
        <div class="card">
            <div class="card-body" id="profile"></div>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script>API.get('/auth/profile').then(r => profile.innerHTML = Object.entries(r.data.data).map(([k, v]) => `<p><b>${k}:</b> ${v ?? ''}</p>`).join(''))</script>
</body>

</html>
