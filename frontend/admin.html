<!doctype html>
<html lang="en">

<head>
    <title>Admin Dashboard</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="admin-page">

    <div id="loader" class="spinner-overlay">
        <div class="spinner-border text-primary"></div>
    </div>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark admin-navbar shadow">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="/admin.html">
                📋 Record System
            </a>

            <div class="d-flex align-items-center">

                <a class="btn btn-light btn-sm me-2" href="/profile.html">
                    Profile
                </a>

                <button onclick="logout()" class="btn btn-danger btn-sm">
                    Logout
                </button>

            </div>

        </div>

    </nav>

    <main class="container py-4">

        <!-- Header -->

        <div class="admin-header mb-4">

            <div>

                <h2 class="fw-bold mb-1">
                    Admin Dashboard
                </h2>

                <p class="text-muted mb-0">
                    Manage records, users and system activity
                </p>

            </div>

        </div>

        <!-- Statistics -->

        <div class="row g-4 mb-4" id="stats"></div>

        <!-- Search Card -->

        <div class="card admin-card shadow-sm mb-4">

            <div class="card-body">

                <div class="row g-3 align-items-center">

                    <div class="col-lg-4">

                        <input id="search" class="form-control" placeholder="Search records...">

                    </div>

                    <div class="col-lg-8">

                        <div class="d-flex flex-wrap gap-2">

                            <button onclick="load()" class="btn btn-primary">
                                Search
                            </button>

                            <a href="/audit-logs.html" class="btn btn-outline-secondary">
                                Audit Logs
                            </a>

                            <a href="/login-history.html" class="btn btn-outline-secondary">
                                Login History
                            </a>

                            <a href="/settings.html" class="btn btn-outline-secondary">
                                Users
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- Records -->

        <div class="table-responsive admin-table shadow">

            <table class="table table-hover align-middle mb-0">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Record</th>

                        <th>Name</th>

                        <th>Status</th>

                        <th>Locked</th>

                        <th width="360">
                            Actions
                        </th>

                    </tr>

                </thead>

                <tbody id="rows"></tbody>

            </table>

        </div>

    </main>

    <script src="/js/api.js"></script>

    <script>

        guard('ADMIN');

        async function loadStats() {

            const r = await API.get('/admin/stats');

            stats.innerHTML = Object.entries(r.data.data).map(([k, v]) => `

            <div class="col-lg-3 col-md-6">

                <div class="card card-stat">

                    <div class="card-body text-center">

                        <h6>${k.toUpperCase()}</h6>

                        <h2>${v}</h2>

                    </div>

                </div>

            </div>

            `).join('');

        }

        async function action(a, id) {

            if (!await Swal.fire({
                title: `${a} record?`,
                showCancelButton: true,
                confirmButtonText: 'Yes'
            }).then(x => x.isConfirmed)) return;

            await API.post('/records/' + a, { id });

            toast('Action completed');

            load();

            loadStats();

        }

        async function del(id) {

            if (!await Swal.fire({
                title: 'Delete record?',
                showCancelButton: true,
                confirmButtonText: 'Delete'
            }).then(x => x.isConfirmed)) return;

            await API.delete('/records/' + id);

            load();

            loadStats();

        }

        async function load() {

            const r = await API.get('/records', {
                params: {
                    search: search.value,
                    per_page: 100
                }
            });

            rows.innerHTML = r.data.data.items.map(x => `

<tr>

<td>${x.id}</td>

<td>${x.record_id}</td>

<td>${x.name}</td>

<td>
<span class="badge bg-primary">
${x.status}
</span>
</td>

<td>

${x.is_locked
                    ? '<span class="badge bg-danger">Locked</span>'
                    : '<span class="badge bg-success">Open</span>'}

</td>

<td class="d-flex flex-wrap gap-1">

<a class="btn btn-info btn-sm"
href="/view-record.html?id=${x.id}">
View
</a>

<a class="btn btn-warning btn-sm"
href="/edit-record.html?id=${x.id}">
Edit
</a>

<button class="btn btn-secondary btn-sm"
onclick="action('${x.is_locked ? 'unlock' : 'lock'}',${x.id})">

${x.is_locked ? 'Unlock' : 'Lock'}

</button>

<button class="btn btn-success btn-sm"
onclick="action('approve',${x.id})">

Approve

</button>

<button class="btn btn-dark btn-sm"
onclick="action('reject',${x.id})">

Reject

</button>

<button class="btn btn-danger btn-sm"
onclick="del(${x.id})">

Delete

</button>

</td>

</tr>

`).join('');

        }

        load();

        loadStats();

    </script>

</body>

</html>
